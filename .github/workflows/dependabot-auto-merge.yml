name: Dependabot auto-merge

# Enable auto-merge on Dependabot patch and minor update pull requests so they
# merge on their own once the required CI check passes. Major-version bumps still
# open a pull request but wait for a human — a major update is where a breaking
# change or a swapped maintainer is most likely to slip through. Auto-merge only
# ever completes after the branch ruleset's required `test` check is green, so a
# dependency that breaks the build or the tests can never land unattended.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for patch and minor updates
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
